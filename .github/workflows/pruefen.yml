# Checks every push: the three packages run their tests, and the app is
# built for the iOS Simulator. Nothing here is signed — a simulator build
# does not need a certificate, so this runs on a plain GitHub runner.

name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Package tests
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        package: [JellyfinKit, SubsonicKit, MusikKit]
    steps:
      - uses: actions/checkout@v4

      - name: Cache
        uses: actions/cache@v4
        with:
          path: Packages/${{ matrix.package }}/.build
          key: spm-${{ runner.os }}-${{ matrix.package }}-${{ hashFiles(format('Packages/{0}/Package.swift', matrix.package)) }}
          restore-keys: spm-${{ runner.os }}-${{ matrix.package }}-

      - name: swift test
        working-directory: Packages/${{ matrix.package }}
        run: swift test

  app:
    name: iOS Simulator build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: XcodeGen
        run: brew install xcodegen

      # The .xcodeproj is not checked in; it is generated from project.yml.
      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project SwiftlyMusic.xcodeproj -scheme SwiftlyMusic-iOS \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            -quiet build
